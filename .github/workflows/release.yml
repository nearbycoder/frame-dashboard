name: Test and publish dashboard
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python3 scripts/check-public-source.py
      - run: npm ci --prefix dashboard
      - run: node --test dashboard/*.test.mjs
      - run: npm run build --prefix dashboard
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node dashboard/publish-bundle.mjs "$RELEASE_TAG" dashboard-bundle.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-bundle
          path: dashboard-bundle.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-bundle
      - name: Publish complete release
        run: |
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dashboard-bundle.json --repo "$RELEASE_REPO"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
